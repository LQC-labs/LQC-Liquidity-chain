<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LQC Lending Stage 1 사전검증</title><style>:root{font-family:system-ui,sans-serif;color:#152326;background:#f2faf8}body{margin:0;padding:20px 14px}.card{max-width:760px;margin:auto;background:#fff;border:1px solid #d7e9e5;border-radius:22px;padding:22px}.badge{display:inline-block;background:#ddf7ef;color:#087562;border-radius:999px;padding:6px 10px;font-weight:800}.warning{background:#fff3d8;border-radius:14px;padding:14px;margin:16px 0}label{display:block;font-weight:800;margin:16px 0 7px}input{box-sizing:border-box;width:100%;border:1px solid #a9c3bd;border-radius:12px;padding:14px;font-size:16px}button{width:100%;border:0;border-radius:14px;padding:16px;margin-top:16px;font-size:17px;font-weight:800;background:#087f6d;color:#fff}button:disabled{background:#a6b9b5}.row{padding:11px 0;border-bottom:1px solid #e5efed}code{display:block;overflow-wrap:anywhere;margin-top:5px;white-space:pre-line}#status{padding:14px;border-radius:14px;background:#edf5f3;margin-top:16px;white-space:pre-line}#status[data-type="error"]{background:#ffe9ed;color:#a51f3d}#status[data-type="ok"]{background:#ddf7eb;color:#086c4c}.small{font-size:14px;color:#526966}</style></head><body><main class="card"><span class="badge">STAGE 1 · 읽기 전용 · 거래 없음</span><h1>Oracle Manager·Rate Model 사전검증</h1><p>확정 매니페스트와 두 RPC를 이용해 예상 CREATE 주소 2개, 가스 추정값과 배포자 잔액을 검사합니다.</p><div class="warning"><b>안전 범위:</b> 지갑 연결·서명·배포·거래·가스비가 없습니다. RPC 주소는 저장하지 않습니다.</div><label for="publicRpc">RPC 1 · PublicNode</label><input id="publicRpc" value="https://bsc-testnet-rpc.publicnode.com" inputmode="url" autocomplete="off" spellcheck="false"><label for="privateRpc">RPC 2 · QuickNode</label><input id="privateRpc" type="password" placeholder="자동입력 링크를 사용하세요" inputmode="url" autocomplete="off" spellcheck="false"><p class="small">QuickNode 주소는 화면 메모리에서만 사용되고 주소창에서 즉시 제거됩니다.</p><button id="verify">Stage 1 읽기 전용 사전검증</button><div class="row"><b>매니페스트</b><code id="manifest">확인 전</code></div><div class="row"><b>공통 상태</b><code id="state">확인 전</code></div><div class="row"><b>예상 배포주소·가스</b><code id="deployments">확인 전</code></div><div class="row"><b>최대 가스예산</b><code id="budget">확인 전</code></div><div id="status">자동입력 링크로 연 뒤 검사 버튼을 누르세요.</div></main><script src="https://cdn.jsdelivr.net/npm/ethers@6.17.0/dist/ethers.umd.min.js" integrity="sha384-lApM4ELRuFNT7NgNqnXB2zFWgSDdhVvmnOHov2DPJz/2zuNpZImXBeklFr18ilvi" crossorigin="anonymous"></script><script src="./lending-stage1-live-preflight-testnet.js?v=1"></script></body></html>
