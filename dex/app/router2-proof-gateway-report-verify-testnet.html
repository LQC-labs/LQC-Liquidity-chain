<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LQC 운영점검 JSON 독립검증</title><style>:root{font-family:system-ui,sans-serif;color:#122126;background:#f3fbf9}body{margin:0;padding:20px 14px}.card{max-width:720px;margin:auto;background:#fff;border:1px solid #d9ece7;border-radius:22px;padding:22px}.badge{display:inline-block;background:#dff8f1;color:#087b69;border-radius:999px;padding:6px 10px;font-weight:700}.notice{background:#eaf6f3;border-radius:14px;padding:14px;margin:16px 0}textarea{width:100%;box-sizing:border-box;min-height:230px;border:1px solid #bfd8d2;border-radius:14px;padding:12px;font:14px ui-monospace,monospace}button{width:100%;border:0;border-radius:14px;padding:16px;margin-top:12px;font-size:17px;font-weight:800;background:#152825;color:#fff}button.secondary{background:#0b8f7d}.row{padding:11px 0;border-bottom:1px solid #e5efed}code{display:block;white-space:pre-line;overflow-wrap:anywhere;word-break:break-all;margin-top:5px}#status{padding:14px;border-radius:14px;background:#edf5f3;margin-top:16px;white-space:pre-line}#status[data-type="error"]{background:#ffe9ed;color:#ad2140}#status[data-type="ok"]{background:#dff8ed;color:#08724f}</style></head><body><main class="card"><span class="badge">BSC TESTNET · JSON 검증 · 거래 없음</span><h1>운영점검 JSON 독립검증</h1><p>Proof Gateway 운영 모니터에서 복사한 JSON의 형식과 Report Hash를 다시 계산해 변조 여부를 확인합니다.</p><div class="notice"><b>안전 범위:</b> 지갑을 연결하지 않고 입력한 JSON만 검사합니다. 서명·승인·스왑·가스비가 없습니다.</div><textarea id="input" placeholder="복사한 운영 점검 JSON을 여기에 붙여넣으세요."></textarea><button class="secondary" id="paste">1. 클립보드 JSON 불러오기</button><button id="verify">2. 형식·Report Hash 검증</button><div class="row"><b>검증 결과</b><code id="result">확인 전</code></div><div class="row"><b>Report Hash</b><code id="hash">확인 전</code></div><div class="row"><b>상세</b><code id="detail">확인 전</code></div><div id="status">운영 점검 JSON을 불러온 뒤 검증하세요.</div></main><script src="https://cdn.jsdelivr.net/npm/ethers@6.17.0/dist/ethers.umd.min.js" integrity="sha384-lApM4ELRuFNT7NgNqnXB2zFWgSDdhVvmnOHov2DPJz/2zuNpZImXBeklFr18ilvi" crossorigin="anonymous"></script><script src="./router2-proof-gateway-report-verify-testnet.js?v=1"></script></body></html>
