<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LQC Proof Gateway 검증자료 내보내기</title><style>:root{font-family:system-ui,sans-serif;color:#122126;background:#f3fbf9}body{margin:0;padding:20px 14px}.card{max-width:720px;margin:auto;background:#fff;border:1px solid #d9ece7;border-radius:22px;padding:22px}.badge{display:inline-block;background:#dff8f1;color:#087b69;border-radius:999px;padding:6px 10px;font-weight:700}.notice{background:#eaf6f3;border-radius:14px;padding:14px;margin:16px 0}.row{padding:11px 0;border-bottom:1px solid #e5efed}code{display:block;overflow-wrap:anywhere;word-break:break-all;margin-top:5px}button{width:100%;border:0;border-radius:14px;padding:15px;margin-top:13px;font-size:17px;font-weight:800;background:#0b8f7d;color:#fff}button.secondary{background:#152825}button:disabled{background:#a5bbb6}pre{max-height:380px;overflow:auto;white-space:pre-wrap;word-break:break-all;background:#f4f7f6;border-radius:12px;padding:12px;font-size:12px}#status{padding:14px;border-radius:14px;background:#edf5f3;margin-top:14px;white-space:pre-line;overflow-wrap:anywhere}#status[data-type="error"]{background:#ffe9ed;color:#ad2140}#status[data-type="ok"]{background:#dff8ed;color:#08724f}</style></head><body><main class="card"><span class="badge">BSC TESTNET · 공개 증거 · 읽기 전용</span><h1>검증자료 한 번에 복사</h1><p>완료된 단계의 공개 계약 주소·거래 해시·Proof·Evidence만 하나의 JSON으로 묶습니다.</p><div class="notice"><b>안전 범위:</b> 개인키·시드문구·서명·지갑 비밀정보는 읽거나 포함하지 않습니다. 온체인 거래와 가스비도 없습니다.</div><div class="row"><b>포함 단계</b><code id="count">생성 전</code></div><div class="row"><b>Bundle Hash</b><code id="hash">생성 전</code></div><button id="generate" class="secondary">1. 공개 검증자료 생성</button><button id="copy" disabled>2. 검증 JSON 복사</button><pre id="output">아직 생성하지 않았습니다.</pre><div id="status">완료된 단계가 있는 시점에 생성할 수 있습니다.</div></main><script src="https://cdn.jsdelivr.net/npm/ethers@6.17.0/dist/ethers.umd.min.js" integrity="sha384-lApM4ELRuFNT7NgNqnXB2zFWgSDdhVvmnOHov2DPJz/2zuNpZImXBeklFr18ilvi" crossorigin="anonymous"></script><script src="./router2-proof-gateway-evidence-export-testnet.js?v=1"></script></body></html>
