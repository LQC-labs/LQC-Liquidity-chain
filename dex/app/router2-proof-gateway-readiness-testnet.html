<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LQC Proof Gateway 실행 준비검증</title><style>:root{font-family:system-ui,sans-serif;color:#122126;background:#f3fbf9}body{margin:0;padding:20px 14px}.card{max-width:720px;margin:auto;background:#fff;border:1px solid #d9ece7;border-radius:22px;padding:22px}.badge{display:inline-block;background:#dff8f1;color:#087b69;border-radius:999px;padding:6px 10px;font-weight:700}.notice{background:#eaf6f3;border-radius:14px;padding:14px;margin:16px 0}.row{padding:11px 0;border-bottom:1px solid #e5efed}code{display:block;white-space:pre-line;overflow-wrap:anywhere;word-break:break-all;margin-top:5px}button{width:100%;border:0;border-radius:14px;padding:16px;margin-top:14px;font-size:17px;font-weight:800;background:#152825;color:#fff}#status{padding:14px;border-radius:14px;background:#edf5f3;margin-top:16px;white-space:pre-line;overflow-wrap:anywhere}#status[data-type="error"]{background:#ffe9ed;color:#ad2140}#status[data-type="ok"]{background:#dff8ed;color:#08724f}</style></head><body><main class="card"><span class="badge">BSC TESTNET · GATEWAY 실행 준비 · 읽기 전용</span><h1>Proof Gateway 실행 준비검증</h1><p>10 tLQC → LQC Flow → WBNB 경로의 새 견적을 만들고 배포된 Proof 계약에서 직접 검증합니다.</p><div class="notice"><b>안전 범위:</b> 토큰 승인·스왑·지갑 서명·가스비가 발생하지 않습니다. 준비 Proof는 10분 동안만 유효합니다.</div><div class="row"><b>Proof 계약 / Gateway</b><code id="contracts">확인 전</code></div><div class="row"><b>LQC Flow 현재 견적</b><code id="quote">확인 전</code></div><div class="row"><b>최소 수령</b><code id="minimum">확인 전</code></div><div class="row"><b>온체인 Proof Hash</b><code id="proof">확인 전</code></div><div class="row"><b>유효시간</b><code id="expiry">확인 전</code></div><button id="verify">1. Gateway 실행 읽기 전용 준비검증</button><div id="status">Proof Gateway 최종검증 완료 후 실행하세요.</div></main><script src="https://cdn.jsdelivr.net/npm/ethers@6.17.0/dist/ethers.umd.min.js" integrity="sha384-lApM4ELRuFNT7NgNqnXB2zFWgSDdhVvmnOHov2DPJz/2zuNpZImXBeklFr18ilvi" crossorigin="anonymous"></script><script src="./router2-proof-gateway-readiness-testnet.js?v=1"></script></body></html>
