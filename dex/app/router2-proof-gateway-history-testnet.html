<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LQC Proof Gateway 거래 이력</title><style>:root{font-family:system-ui,sans-serif;color:#122126;background:#f3fbf9}body{margin:0;padding:20px 14px}.card{max-width:720px;margin:auto;background:#fff;border:1px solid #d9ece7;border-radius:22px;padding:22px}.badge{display:inline-block;background:#dff8f1;color:#087b69;border-radius:999px;padding:6px 10px;font-weight:700}.notice,#status{background:#edf5f3;border-radius:14px;padding:14px;margin:16px 0}section{border:1px solid #dceae7;border-radius:14px;padding:14px;margin:12px 0}code{display:block;white-space:pre-line;overflow-wrap:anywhere;word-break:break-all;margin-top:8px}a.action{display:block;text-align:center;text-decoration:none;border-radius:14px;padding:15px;margin-top:10px;font-weight:800;background:#e2f5ef;color:#087b69}button{width:100%;border:0;border-radius:14px;padding:15px;margin-top:12px;font-size:17px;font-weight:800;background:#152825;color:#fff}button.secondary{background:#0b8f7d}button:disabled{opacity:.45}#status[data-type="error"]{background:#ffe9ed;color:#ad2140}#status[data-type="ok"]{background:#dff8ed;color:#08724f}</style></head><body><main class="card"><span class="badge">BSC TESTNET · 읽기 전용 · 거래 없음</span><h1>완료 거래 이력 검증</h1><p>새 거래 주기를 시작할 때 보관한 이전 거래의 Hash와 Proof·입출력·Evidence 연결을 검사합니다.</p><div class="notice"><b>안전 범위:</b> 지갑 연결·서명·승인·거래·가스비 없이 이 휴대폰 브라우저에 보관된 공개 기록만 확인합니다.</div><div><b>검증된 보관 거래</b> <span id="count">확인 중</span></div><div id="list"></div><button id="refresh">이력 다시 검증</button><button class="secondary" id="liveVerify">현재 온체인 이력 재검증</button><div><b>온체인 재검증</b><code id="live">확인 전</code></div><div><b>History Verification Hash</b><code id="verificationHash">확인 전</code></div><button id="copyLiveReceipt" disabled>온체인 검증 영수증 복사</button><button class="secondary" id="copy" disabled>검증된 이력 JSON 복사</button><button id="restore">클립보드 검증 JSON으로 이력 복구</button><a class="action" href="./router2-proof-gateway-history-receipt-verify-testnet.html">감사 영수증 독립검증 화면</a><div id="status">거래 이력을 확인하고 있습니다.</div></main><script src="https://cdn.jsdelivr.net/npm/ethers@6.17.0/dist/ethers.umd.min.js" integrity="sha384-lApM4ELRuFNT7NgNqnXB2zFWgSDdhVvmnOHov2DPJz/2zuNpZImXBeklFr18ilvi" crossorigin="anonymous"></script><script src="./router2-proof-gateway-history-testnet.js?v=4"></script></body></html>
