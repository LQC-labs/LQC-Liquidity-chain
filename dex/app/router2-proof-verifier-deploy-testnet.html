<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LQC Proof 검증계약 배포</title><style>:root{font-family:system-ui,sans-serif;color:#122126;background:#f3fbf9}body{margin:0;padding:20px 14px}.card{max-width:720px;margin:auto;background:#fff;border:1px solid #d9ece7;border-radius:22px;padding:22px}.badge{display:inline-block;background:#dff8f1;color:#087b69;border-radius:999px;padding:6px 10px;font-weight:700}.warning{background:#fff0d8;border-radius:14px;padding:14px;margin:16px 0}.row{padding:11px 0;border-bottom:1px solid #e5efed}code{display:block;overflow-wrap:anywhere;word-break:break-all;margin-top:5px}button{width:100%;border:0;border-radius:14px;padding:16px;margin-top:13px;font-size:17px;font-weight:800;background:#0b8f7d;color:#fff}button.secondary{background:#152825}button:disabled{background:#a5bbb6}#status{padding:14px;border-radius:14px;background:#edf5f3;margin-top:16px;white-space:pre-line;overflow-wrap:anywhere}#status[data-type="error"]{background:#ffe9ed;color:#ad2140}#status[data-type="ok"]{background:#dff8ed;color:#08724f}</style></head><body><main class="card"><span class="badge">BSC TESTNET · 1단계 · 단일 계약</span><h1>Proof 검증계약 배포</h1><p>온체인에서 Best Execution 후보와 Proof Hash를 검증할 계약 하나만 배포합니다.</p><div class="warning"><b>주의:</b> 1번은 읽기 전용이라 가스비가 없습니다. 2번은 실제 테스트넷 계약 배포이므로 TokenPocket 확인과 tBNB 가스비가 발생합니다. 토큰 승인·스왑은 하지 않습니다.</div><div class="row"><b>연결 지갑</b><code id="wallet">확인 전</code></div><div class="row"><b>기존 Execution Router</b><code id="router">확인 전</code></div><div class="row"><b>예상 가스</b><code id="gas">확인 전</code></div><div class="row"><b>배포 계약 주소</b><code id="contract">배포 전</code></div><div class="row"><b>배포 거래 해시</b><code id="tx">배포 전</code></div><button id="preflight" class="secondary">1. 연결·코드·가스 읽기 전용 사전검증</button><button id="deploy" disabled>2. Best Execution Proof 검증계약 1개 배포</button><div id="status">먼저 1번 사전검증을 실행하세요.</div></main><script src="https://cdn.jsdelivr.net/npm/ethers@6.17.0/dist/ethers.umd.min.js" integrity="sha384-lApM4ELRuFNT7NgNqnXB2zFWgSDdhVvmnOHov2DPJz/2zuNpZImXBeklFr18ilvi" crossorigin="anonymous"></script><script src="./router2-proof-verifier-deploy-testnet.js?v=1"></script></body></html>
