<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LQC Flow 실행 최종 검증</title><style>:root{font-family:system-ui,sans-serif;color:#122126;background:#f3fbf9}body{margin:0;padding:20px 14px}.card{max-width:720px;margin:auto;background:#fff;border:1px solid #d9ece7;border-radius:22px;padding:22px}.badge{display:inline-block;background:#dff8f1;color:#087b69;border-radius:999px;padding:6px 10px;font-weight:700}.row{padding:10px 0;border-bottom:1px solid #e5efed}code{display:block;overflow-wrap:anywhere;margin-top:4px}button{width:100%;border:0;border-radius:14px;padding:15px;margin-top:12px;font-size:17px;font-weight:800;background:#0b8f7d;color:#fff}button.secondary{background:#152825}button:disabled{background:#a5bbb6}#status{padding:14px;border-radius:14px;background:#edf5f3;margin-top:16px;white-space:pre-line}#status[data-type="error"]{background:#ffe9ed;color:#ad2140}#status[data-type="ok"]{background:#dff8ed;color:#08724f}</style></head><body><main class="card"><span class="badge">BSC TESTNET · 읽기 전용</span><h1>LQC Flow 실행 최종 검증</h1><p>같은 휴대폰에 저장된 실행 해시와 온체인 영수증을 대조합니다. 새 거래는 전송하지 않습니다.</p><div class="row"><b>거래 해시</b><code id="hash">확인 전</code></div><div class="row"><b>블록</b><code id="block">확인 전</code></div><div class="row"><b>실제 출력</b><code id="output">확인 전</code></div><button id="verify" class="secondary">1. 온체인 최종 상태 검증</button><button id="copy" disabled>2. 전체 거래 해시 복사</button><div id="status">1번 검증을 누르세요.</div></main><script src="./router2-lqc-flow-final-state-testnet.js?v=1"></script></body></html>
