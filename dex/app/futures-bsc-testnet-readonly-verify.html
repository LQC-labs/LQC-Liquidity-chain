<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LQC Futures BSC Testnet Read-only Verifier</title>
<style>body{font-family:system-ui,sans-serif;max-width:760px;margin:auto;padding:20px;background:#f7f9fc;color:#172033}button{padding:14px 18px;font-size:16px}.card{background:#fff;padding:16px;margin:12px 0;border-radius:12px;box-shadow:0 1px 5px #ccd3dd}code{word-break:break-all}.ok{color:#087a3b}.bad{color:#b42318}</style></head>
<body><h1>LQC Futures BSC Testnet 검증</h1>
<p>읽기 전용입니다. 트랜잭션을 생성하거나 서명을 요청하지 않습니다.</p>
<button id="check">온체인 상태 검증</button><div id="out"></div>
<script src="https://cdn.jsdelivr.net/npm/ethers@6.13.5/dist/ethers.umd.min.js"></script>
<script>
const RPC="https://data-seed-prebsc-1-s1.bnbchain.org:8545/";
const OWNER="0x89d992f696B40ABbDB6610144faeF336911D8175".toLowerCase();
const A={Registry:"0xfbd1c5c8dbbdadf3eb834f351366daf55f2d73b0",Vault:"0xb532c65294a7b35ca510a7df025e934fa17c8d7e",Oracle:"0xbf6a446c5e17228e70e45645ab47f751bdfc4b41",Engine:"0xe4f1320c8709631776c7e39e0916584935882525"};
const out=document.getElementById("out");
async function rpc(method,params=[]){const r=await fetch(RPC,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({jsonrpc:"2.0",id:1,method,params})});const j=await r.json();if(j.error)throw Error(j.error.message);return j.result}
const card=(s,ok)=>'<div class="card '+(ok?'ok':'bad')+'">'+s+'</div>';
document.getElementById("check").onclick=async()=>{out.innerHTML="검증 중…";let h="",all=true;
 async function step(label,fn){try{const v=await fn();h+=card(label+" ✓"+(v?"<br>"+v:""),true);out.innerHTML=h;return v}catch(e){all=false;h+=card(label+" ✗<br>"+String(e.message||e),false);out.innerHTML=h;return null}}
 const chain=await step("1. Chain ID",async()=>{const x=await rpc("eth_chainId");if(x!=="0x61")throw Error("예상 97, 실제 "+parseInt(x,16));return "97"});
 for(const [n,a] of Object.entries(A))await step("Runtime code — "+n,async()=>{const x=await rpc("eth_getCode",[a,"latest"]);if(!x||x==="0x")throw Error("runtime code 없음");return "<code>"+a+"</code>"});
 const iface=new ethers.Interface(["function owner() view returns(address)","function engine() view returns(address)"]);
 await step("Vault.owner()",async()=>{const x=await rpc("eth_call",[{to:A.Vault,data:iface.encodeFunctionData("owner")},"latest"]);const v=("0x"+x.slice(-40)).toLowerCase();if(v!==OWNER)throw Error("Owner 불일치: "+v);return "<code>"+v+"</code>"});
 await step("Vault.engine()",async()=>{const x=await rpc("eth_call",[{to:A.Vault,data:iface.encodeFunctionData("engine")},"latest"]);const v=("0x"+x.slice(-40)).toLowerCase();if(v!==A.Engine.toLowerCase())throw Error("Engine 불일치: "+v);return "<code>"+v+"</code>"});
 h+=card(all?"최종 결과: PASS — 읽기 전용 온체인 검증 완료":"최종 결과: FAIL — 실패 단계가 위에 표시됨",all);out.innerHTML=h;
};
</script></body></html>
