<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LQC Lending Stage 1 최종검증</title><style>:root{font-family:system-ui,sans-serif;color:#152326;background:#f2faf8}body{margin:0;padding:18px 12px}.card{max-width:760px;margin:auto;background:#fff;border:1px solid #d7e9e5;border-radius:22px;padding:20px}.badge{display:inline-block;background:#ddf7ef;color:#087562;border-radius:999px;padding:6px 10px;font-weight:800}.warning,#status{border-radius:14px;padding:14px;margin:16px 0}.warning{background:#fff3d8}label{display:block;font-weight:800;margin:14px 0 7px}input{box-sizing:border-box;width:100%;padding:14px;border:1px solid #a9c3bd;border-radius:12px;font-size:16px}button{width:100%;padding:16px;border:0;border-radius:14px;background:#098b76;color:#fff;font-size:17px;font-weight:800;margin-top:16px}button:disabled{background:#a7bbb7}.row{padding:12px 0;border-bottom:1px solid #e5efed}code{display:block;white-space:pre-line;overflow-wrap:anywhere;word-break:break-all;margin-top:5px}#status{background:#edf5f3}#status[data-type="error"]{background:#ffe9ed;color:#a51f3d}#status[data-type="ok"]{background:#ddf7eb;color:#086c4c}.small{font-size:14px;color:#526966}</style></head><body><main class="card"><span class="badge">STAGE 1 · 최종 읽기 전용 · 거래 없음</span><h1>배포 영수증·계약 상태 최종검증</h1><p>두 독립 RPC에서 두 배포 거래와 계약 상태가 일치하는지 다시 확인합니다.</p><div class="warning"><b>안전 범위:</b> 지갑 연결·서명·거래·가스비가 없습니다. QuickNode 주소는 저장하지 않습니다.</div><label>RPC 1 · PublicNode</label><input id="publicRpc" value="https://bsc-testnet-rpc.publicnode.com" readonly><label>RPC 2 · QuickNode</label><input id="privateRpc" type="password" placeholder="자동입력 링크를 사용하세요" autocomplete="off"><p class="small">주소창의 RPC 정보는 화면을 연 즉시 제거됩니다.</p><button id="verify">Stage 1 최종 읽기 전용 검증</button><div class="row"><b>LQCOracleManager</b><code id="oracle">확인 전</code></div><div class="row"><b>LQCInterestRateModel</b><code id="rate">확인 전</code></div><div class="row"><b>공통 역할</b><code id="roles">확인 전</code></div><div id="status">검증 버튼을 누르세요.</div></main><script src="https://cdn.jsdelivr.net/npm/ethers@6.17.0/dist/ethers.umd.min.js" integrity="sha384-lApM4ELRuFNT7NgNqnXB2zFWgSDdhVvmnOHov2DPJz/2zuNpZImXBeklFr18ilvi" crossorigin="anonymous"></script><script src="./lending-stage1-final-verification-testnet.js?v=1"></script></body></html>
