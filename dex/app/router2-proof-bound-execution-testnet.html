<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LQC Proof 결합 1회 실행</title><style>:root{font-family:system-ui,sans-serif;color:#122126;background:#f3fbf9}body{margin:0;padding:20px 14px}.card{max-width:720px;margin:auto;background:#fff;border:1px solid #d9ece7;border-radius:22px;padding:22px}.badge{display:inline-block;background:#dff8f1;color:#087b69;border-radius:999px;padding:6px 10px;font-weight:700}.warning{background:#fff0d8;border-radius:14px;padding:14px;margin:16px 0}.row{padding:11px 0;border-bottom:1px solid #e5efed}code{display:block;overflow-wrap:anywhere;margin-top:5px}button{width:100%;border:0;border-radius:14px;padding:16px;margin-top:13px;font-size:17px;font-weight:800;background:#0b8f7d;color:#fff}button.secondary{background:#152825}button:disabled{background:#a5bbb6}#status{padding:14px;border-radius:14px;background:#edf5f3;margin-top:16px;white-space:pre-line}#status[data-type="error"]{background:#ffe9ed;color:#ad2140}#status[data-type="ok"]{background:#dff8ed;color:#08724f}</style></head><body><main class="card"><span class="badge">BSC TESTNET · PROOF 결합 · 1회 제한</span><h1>Proof 결합 LQC Flow 실행</h1><p>통합 검증에서 고정된 Proof·Intent·최소수령·Router·nonce와 정확히 일치하는 10 tLQC 거래만 허용합니다.</p><div class="warning"><b>주의:</b> 2번은 토큰 승인 거래, 3번은 실제 테스트넷 스왑입니다. 각각 지갑 확인과 tBNB 가스비가 발생합니다.</div><div class="row"><b>입력 / 경로</b><code>10 tLQC → LQC Flow → WBNB</code></div><div class="row"><b>Proof / Intent</b><code id="evidence">확인 전</code></div><div class="row"><b>최소 수령 / 실행 nonce</b><code id="execution">확인 전</code></div><button id="verify" class="secondary">1. Proof 결합 읽기 전용 사전검증</button><button id="approve" disabled>2. Execution Router에 정확히 10 tLQC 승인</button><button id="swap" disabled>3. Proof 결합 LQC Flow 1회 실행</button><div id="status">먼저 1번 읽기 전용 사전검증을 실행하세요.</div></main><script src="https://cdn.jsdelivr.net/npm/ethers@6.17.0/dist/ethers.umd.min.js" integrity="sha384-lApM4ELRuFNT7NgNqnXB2zFWgSDdhVvmnOHov2DPJz/2zuNpZImXBeklFr18ilvi" crossorigin="anonymous"></script><script src="./router-sdk.js?v=20260914p"></script><script src="./router2-proof-bound-execution-testnet.js?v=1"></script></body></html>
