<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LQC 통합 실행 준비검증</title><style>:root{font-family:system-ui,sans-serif;color:#122126;background:#f3fbf9}body{margin:0;padding:20px 14px}.card{max-width:720px;margin:auto;background:#fff;border:1px solid #d9ece7;border-radius:22px;padding:22px}.badge{display:inline-block;background:#dff8f1;color:#087b69;border-radius:999px;padding:6px 10px;font-weight:700}.warning{background:#fff4dc;border-radius:14px;padding:14px;margin:16px 0}.row{padding:11px 0;border-bottom:1px solid #e5efed}code{display:block;overflow-wrap:anywhere;margin-top:5px}button{width:100%;border:0;border-radius:14px;padding:16px;margin-top:14px;font-size:17px;font-weight:800;background:#0b8f7d;color:#fff}button:disabled{background:#a5bbb6}#status{padding:14px;border-radius:14px;background:#edf5f3;margin-top:16px;white-space:pre-line}#status[data-type="error"]{background:#ffe9ed;color:#ad2140}#status[data-type="ok"]{background:#dff8ed;color:#08724f}</style></head><body><main class="card"><span class="badge">BSC TESTNET · 4단계 통합 · 거래 없음</span><h1>통합 실행 준비검증</h1><p>최적 경로 사전검증·Best Execution Proof·Execution Intent·최종 준비검증을 한 번에 처리합니다.</p><div class="warning"><b>안전 범위:</b> 지갑 서명·토큰 승인·거래 전송·가스비가 발생하지 않습니다.</div><div class="row"><b>경로 견적</b><code id="quotes">확인 전</code></div><div class="row"><b>선택 경로 / 최소 수령</b><code id="route">확인 전</code></div><div class="row"><b>Proof Hash</b><code id="proof">확인 전</code></div><div class="row"><b>Intent Hash / nonce</b><code id="intent">확인 전</code></div><div class="row"><b>잔액 / 승인 / 가스</b><code id="funds">확인 전</code></div><button id="verify">1. 네 단계 통합 읽기 전용 검증</button><div id="status">버튼 한 번으로 네 단계를 연속 검증합니다. 거래는 발생하지 않습니다.</div></main><script src="https://cdn.jsdelivr.net/npm/ethers@6.17.0/dist/ethers.umd.min.js" integrity="sha384-lApM4ELRuFNT7NgNqnXB2zFWgSDdhVvmnOHov2DPJz/2zuNpZImXBeklFr18ilvi" crossorigin="anonymous"></script><script src="./router-sdk.js?v=20260914p"></script><script src="./router2-integrated-readiness-testnet.js?v=1"></script></body></html>
