<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LQC Proof Gateway 검증기록 복구</title><style>:root{font-family:system-ui,sans-serif;color:#122126;background:#f3fbf9}body{margin:0;padding:20px 14px}.card{max-width:720px;margin:auto;background:#fff;border:1px solid #d9ece7;border-radius:22px;padding:22px}.badge{display:inline-block;background:#dff8f1;color:#087b69;border-radius:999px;padding:6px 10px;font-weight:700}.warning{background:#fff0d8;border-radius:14px;padding:14px;margin:16px 0}.row{padding:11px 0;border-bottom:1px solid #e5efed}code{display:block;overflow-wrap:anywhere;word-break:break-all;margin-top:5px}textarea{box-sizing:border-box;width:100%;min-height:240px;border:1px solid #cbdcd8;border-radius:12px;padding:12px;font-size:12px}button{width:100%;border:0;border-radius:14px;padding:15px;margin-top:13px;font-size:17px;font-weight:800;background:#0b8f7d;color:#fff}button.secondary{background:#152825}button:disabled{background:#a5bbb6}.confirm{display:block;padding:13px 0;font-weight:700}#status{padding:14px;border-radius:14px;background:#edf5f3;margin-top:14px;white-space:pre-line;overflow-wrap:anywhere}#status[data-type="error"]{background:#ffe9ed;color:#ad2140}#status[data-type="ok"]{background:#dff8ed;color:#08724f}</style></head><body><main class="card"><span class="badge">BSC TESTNET · 공개 기록 복구 · 거래 없음</span><h1>검증 JSON으로 기록 복구</h1><p>내보내기로 저장한 공개 JSON을 붙여 넣어 TokenPocket 브라우저의 배포·실행 기록을 복원합니다.</p><div class="warning"><b>안전 원칙:</b> Bundle Hash가 정확히 일치해야 하며, 만료 가능한 준비자료와 최종검증 결과는 복원하지 않습니다. 복원 후 3단계 온체인 최종검증을 반드시 다시 실행합니다.</div><textarea id="input" placeholder="공개 검증 JSON을 여기에 붙여 넣으세요."></textarea><div class="row"><b>포함 단계</b><code id="count">검증 전</code></div><div class="row"><b>확인된 Bundle Hash</b><code id="hash">검증 전</code></div><button id="validate" class="secondary">1. JSON·Bundle Hash 읽기 전용 검증</button><label class="confirm"><input id="confirm" type="checkbox"> 기존 브라우저
