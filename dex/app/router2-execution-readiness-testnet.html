<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LQC 최종 실행 준비 검증</title><style>:root{font-family:system-ui,sans-serif;color:#122126;background:#f3fbf9}body{margin:0;padding:20px 14px}.card{max-width:720px;margin:auto;background:#fff;border:1px solid #d9ece7;border-radius:22px;padding:22px}.badge{display:inline-block;background:#dff8f1;color:#087b69;border-radius:999px;padding:6px 10px;font-weight:700}.warning{background:#fff4dc;border-radius:14px;padding:14px;margin:16px 0}.row{padding:11px 0;border-bottom:1px solid #e5efed}code{display:block;overflow-wrap:anywhere;margin-top:5px}button{width:100%;border:0;border-radius:14px;padding:16px;margin-top:14px;font-size:17px;font-weight:800;background:#152825;color:#fff}#status{padding:14px;border-radius:14px;background:#edf5f3;margin-top:16px;white-space:pre-line}#status[data-type="error"]{background:#ffe9ed;color:#ad2140}#status[data-type="ok"]{background:#dff8ed;color:#08724f}</style></head><body><main class="card"><span class="badge">BSC TESTNET · 최종 읽기 전용 · 거래 없음</span><h1>최종 실행 준비 검증</h1><p>Proof와 Execution Intent가 실제 예정 calldata·Router·nonce 및 현재 온체인 상태와 정확히 일치하는지 확인합니다.</p><div class="warning"><b>안전 범위:</b> 지갑 서명·토큰 승인·거래 전송·가스비가 발생하지 않습니다.</div><div class="row"><b>Proof / Intent</b><code id="evidence">확인 전</code></div><div class="row"><b>Router / nonce</b><code id="execution">확인 전</code></div><div class="row"><b>tLQC 잔액</b><code id="balance">확인 전</code></div><div class="row"><b>현재 승인 잔액</b><code id="allowance">확인 전</code></div><div class="row"><b>가스용 tBNB</b><code id="gas">확인 전</code></div><button id="verify">1. 최종 읽기 전용 준비검증</button><div id="status">유효한 Proof와 Execution Intent가 필요합니다. 거래는 발생하지 않습니다.</div></main><script src="https://cdn.jsdelivr.net/npm/ethers@6.17.0/dist/ethers.umd.min.js" integrity="sha384-lApM4ELRuFNT7NgNqnXB2zFWgSDdhVvmnOHov2DPJz/2zuNpZImXBeklFr18ilvi" crossorigin="anonymous"></script><script src="./router-sdk.js?v=20260914p"></script><script src="./router2-execution-readiness-testnet.js?v=1"></script></body></html>
