<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LQC Lending Stage 3 Core 배포</title><style>:root{font-family:system-ui,sans-serif;color:#152326;background:#f2faf8}body{margin:0;padding:18px 12px}.card{max-width:760px;margin:auto;background:#fff;border:1px solid #d7e9e5;border-radius:22px;padding:20px}.badge{display:inline-block;background:#ddf7ef;color:#087562;border-radius:999px;padding:6px 10px;font-weight:800}.warning{background:#fff3d8;border-radius:14px;padding:14px;margin:16px 0}.row{padding:12px 0;border-bottom:1px solid #e5efed}code{display:block;overflow-wrap:anywhere;word-break:break-all;white-space:pre-line;margin-top:5px}button{width:100%;border:0;border-radius:14px;padding:16px;margin-top:12px;font-size:17px;font-weight:800;background:#098b76;color:#fff}button.secondary{background:#172a27}button:disabled{background:#a7bbb7}#status{padding:14px;border-radius:14px;background:#edf5f3;margin-top:16px;white-space:pre-line;overflow-wrap:anywhere}#status[data-type="error"]{background:#ffe9ed;color:#a51f3d}#status[data-type="ok"]{background:#ddf7eb;color:#086c4c}</style></head><body><main class="card"><span class="badge">4/11 · STAGE 3 · BSC TESTNET</span><h1>LQCLendingCore 단일 배포</h1><p>읽기 전용 재검증을 통과한 경우에만 승인된 Core 1건의 지갑 서명이 활성화됩니다.</p><div class="warning"><b>실제 테스트넷 거래:</b> value 0 tBNB, 최대 가스예산 0.0003574234 tBNB. nonce·주소·gas·binding이 바뀌면 자동 차단됩니다.</div><div class="row"><b>Review digest</b><code id="review"></code></div><div class="row"><b>연결 지갑</b><code id="wallet">연결 전</code></div><div class="row"><b>예상 Core</b><code id="core"></code></div><div class="row"><b>최신 재검증</b><code id="preflight">확인 전</code></div><button id="connect" class="secondary">1. 지갑 연결 및 읽기 전용 재검증</button><button id="deploy" disabled>2. 승인된 LQCLendingCore 1건 배포</button><div class="row"><b>거래 해시</b><code id="tx">없음</code></div><div id="status">먼저 읽기 전용 재검증을 실행하세요.</div></main><script src="https://cdn.jsdelivr.net/npm/ethers@6.17.0/dist/ethers.umd.min.js" integrity="sha384-lApM4ELRuFNT7NgNqnXB2zFWgSDdhVvmnOHov2DPJz/2zuNpZImXBeklFr18ilvi" crossorigin="anonymous"></script><script src="./lending-stage3-deploy-testnet.js?v=1"></script></body></html>
