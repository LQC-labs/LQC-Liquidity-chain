<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>LQC Risk Safe · BSC Testnet</title>
  <style>
    :root{font-family:system-ui,sans-serif;color:#122126;background:#f3fbf9}body{margin:0;padding:24px 14px}.card{max-width:720px;margin:auto;background:#fff;border:1px solid #d9ece7;border-radius:22px;padding:22px;box-shadow:0 10px 30px #193c3420}h1{font-size:26px;margin:0 0 8px}.badge{display:inline-block;background:#dff8f1;color:#087b69;border-radius:999px;padding:6px 10px;font-weight:700}.warning{background:#fff4dc;border-radius:14px;padding:14px;margin:18px 0}ol{padding-left:22px}li{margin:12px 0}code{display:block;overflow-wrap:anywhere;margin-top:3px;color:#34484d}button{width:100%;border:0;border-radius:14px;padding:16px;margin-top:12px;font-size:18px;font-weight:800;background:#0b8f7d;color:#fff}button:disabled{background:#9eb9b3}.secondary{background:#152825}#status{padding:14px;border-radius:14px;background:#edf5f3;margin-top:16px}#status[data-type="error"]{background:#ffe9ed;color:#ad2140}#status[data-type="ok"]{background:#dff8ed;color:#08724f}.result{margin-top:18px;border-top:1px solid #dbe8e5;padding-top:12px}.small{font-size:13px;color:#607277;overflow-wrap:anywhere}
  </style>
</head>
<body><main class="card">
  <span class="badge">TESTNET · CHAIN 97</span>
  <h1>LQC Risk Safe 생성</h1>
  <p>Safe v1.4.1 · 서명자 5명 · 승인 기준 3명</p>
  <div class="warning"><b>주의:</b> BNB 메인넷 또는 Ethereum으로 전환하지 마세요. 이 화면은 BSC Testnet에서만 실행됩니다.</div>
  <h2>등록될 서명자</h2><ol id="owners"></ol>
  <p class="small">공식 Safe Factory: <span id="factory"></span></p>
  <button id="connect" class="secondary">1. Signer 1 연결 및 검증</button>
  <p class="small">연결 지갑: <span id="wallet">아직 연결되지 않음</span></p>
  <button id="deploy" disabled>2. Risk Safe 생성</button>
  <div id="status">먼저 Signer 1 지갑을 연결하세요.</div>
  <div class="result"><p><b>생성된 Risk Safe 주소</b><code id="safe">—</code></p><p><b>거래 해시</b><code id="tx">—</code></p></div>
</main><script src="./governance-safe-testnet.js"></script></body>
</html>
