<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LQC Proof 결합 최종 영수증</title><style>:root{font-family:system-ui,sans-serif;color:#122126;background:#f3fbf9}body{margin:0;padding:20px 14px}.card{max-width:720px;margin:auto;background:#fff;border:1px solid #d9ece7;border-radius:22px;padding:22px}.badge{display:inline-block;background:#dff8f1;color:#087b69;border-radius:999px;padding:6px 10px;font-weight:700}.row{padding:11px 0;border-bottom:1px solid #e5efed}code{display:block;overflow-wrap:anywhere;word-break:break-all;margin-top:5px}button{width:100%;border:0;border-radius:14px;padding:16px;margin-top:14px;font-size:17px;font-weight:800;background:#152825;color:#fff}#status{padding:14px;border-radius:14px;background:#edf5f3;margin-top:16px;white-space:pre-line;overflow-wrap:anywhere}#status[data-type="error"]{background:#ffe9ed;color:#ad2140}#status[data-type="ok"]{background:#dff8ed;color:#08724f}</style></head><body><main class="card"><span class="badge">BSC TESTNET · 최종 영수증 · 거래 없음</span><h1>Proof 결합 실행 최종 검증</h1><p>저장된 거래 해시의 온체인 영수증을 Proof와 Intent에 대조합니다. 새 거래를 전송하지 않습니다.</p><div class="row"><b>전체 거래 해시</b><code id="tx">확인 전</code></div><div class="row"><b>블록 / confirmations</b><code id="block">확인 전</code></div><div class="row"><b>입력 / 실제 출력</b><code id="amounts">확인 전</code></div><div class="row"><b>Proof / Intent</b><code id="binding">확인 전</code></div><div class="row"><b>최종 Evidence Hash</b><code id="evidence">확인 전</code></div><button id="verify">1. 온체인 최종 영수증 검증</button><div id="status">기존 성공 거래만 읽어 검증합니다. 승인·서명·가스비는 없습니다.</div></main><script src="https://cdn.jsdelivr.net/npm/ethers@6.17.0/dist/ethers.umd.min.js" integrity="sha384-lApM4ELRuFNT7NgNqnXB2zFWgSDdhVvmnOHov2DPJz/2zuNpZImXBeklFr18ilvi" crossorigin="anonymous"></script><script src="./router-sdk.js?v=20260914p"></script><script src="./router2-proof-bound-final-state-testnet.js?v=1"></script></body></html>
