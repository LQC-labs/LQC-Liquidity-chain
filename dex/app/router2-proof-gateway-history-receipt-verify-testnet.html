<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LQC 이력 감사 영수증 독립검증</title><style>:root{font-family:system-ui,sans-serif;color:#122126;background:#f3fbf9}body{margin:0;padding:20px 14px}.card{max-width:720px;margin:auto;background:#fff;border:1px solid #d9ece7;border-radius:22px;padding:22px}.badge{display:inline-block;background:#dff8f1;color:#087b69;border-radius:999px;padding:6px 10px;font-weight:700}.notice,#status{background:#edf5f3;border-radius:14px;padding:14px;margin:16px 0}textarea{width:100%;box-sizing:border-box;min-height:150px;border:1px solid #bfd8d2;border-radius:14px;padding:12px;margin-top:10px;font:13px ui-monospace,monospace}button{width:100%;border:0;border-radius:14px;padding:15px;margin-top:10px;font-size:16px;font-weight:800;background:#152825;color:#fff}.secondary{background:#0b8f7d}.row{padding:10px 0;border-bottom:1px solid #e5efed}code{display:block;overflow-wrap:anywhere;word-break:break-all;margin-top:5px}#status[data-type="error"]{background:#ffe9ed;color:#ad2140}#status[data-type="ok"]{background:#dff8ed;color:#08724f}#status[data-type="warning"]{background:#fff2cc;color:#795900}</style></head><body><main class="card"><span class="badge">BSC TESTNET · 독립검증 · 거래 없음</span><h1>이력 감사 영수증 독립검증</h1><div class="notice">거래 이력 JSON과 온체인 검증 영수증 JSON을 함께 검사합니다. 계정 요청·서명·승인·거래·가스비가 없습니다.</div><textarea id="history" placeholder="검증된 이력 JSON"></textarea><button class="secondary" id="pasteHistory">1. 이력 JSON 붙여넣기</button><textarea id="receipt" placeholder="온체인 검증 영수증 JSON"></textarea><button class="secondary" id="pasteReceipt">2. 감사 영수증 붙여넣기</button><button id="verify">3. Archive Root·Verification Hash 검증</button><button class="secondary" id="liveVerify">4. 현재 정식 블록 해시 확인</button><div class="row"><b>결과</b><code id="result">확인 전</code></div><div class="row"><b>Archive Root</b><code id="root">확인 전</code></div><div class="row"><b>History Verification Hash</b><code id="verification">확인 전</code></div><div class="row"><b>온체인 블록 확인</b><code id="live">확인 전</code></div><div id="status">두 JSON을 차례로 붙여넣으세요.</div></main><script src="https://cdn.jsdelivr.net/npm/ethers@6.17.0/dist/ethers.umd.min.js" integrity="sha384-lApM4ELRuFNT7NgNqnXB2zFWgSDdhVvmnOHov2DPJz/2zuNpZImXBeklFr18ilvi" crossorigin="anonymous"></script><script src="./router2-proof-gateway-history-receipt-verify-testnet.js?v=1"></script></body></html>
