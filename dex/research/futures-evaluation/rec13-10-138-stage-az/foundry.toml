[profile.default]
src = "src"
test = "test"
solc_version = "0.8.30"
optimizer = true
optimizer_runs = 200
via_ir = true
evm_version = "shanghai"
auto_detect_solc = false
fs_permissions = [{ access = "read", path = "./out" }]

# Optional authenticated Pyth third-proof suite. Never runs under default profile.
# A genuine API-produced test-auth/fixtures/second_exit.hex is REQUIRED.
[profile.authenticated]
test = "test-auth"
fs_permissions = [
  { access = "read", path = "./out" },
  { access = "read", path = "./test-auth/fixtures" }
]
