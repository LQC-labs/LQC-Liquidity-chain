name: Master 4 Vault Gap Classification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gap-classification:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node test/master4-vault-gap-classification.test.js
