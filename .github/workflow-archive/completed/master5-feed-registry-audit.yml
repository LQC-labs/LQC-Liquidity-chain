name: Master 5 Feed Registry Audit
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  feed-registry-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node test/master5-feed-registry-audit.test.js
