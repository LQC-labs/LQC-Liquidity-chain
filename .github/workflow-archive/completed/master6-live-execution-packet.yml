name: Master 6 Live Execution Packet
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: dex/package-lock.json
      - name: Install DEX dependencies
        working-directory: dex
        run: npm ci
      - name: Compile current Lending sources
        working-directory: dex
        run: npm run compile
      - name: Validate live packet generator syntax
        working-directory: dex
        run: node --check scripts/generate-master6-live-execution-packet.mjs
      - name: Verify deployer and approval input guards
        run: node --test test/master6-live-execution-packet-input.test.js
  live-packet:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MASTER6_DEPLOYER: ${{ inputs.deployer }}
      MASTER6_SOURCE_COMMIT: ${{ inputs.source_commit }}
      MASTER6_EXECUTION_APPROVAL: ${{ inputs.approval_phrase }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: dex/package-lock.json
      - name: Install DEX dependencies
        working-directory: dex
        run: npm ci
      - name: Compile current Lending sources
        working-directory: dex
        run: npm run compile
      - name: Generate live approved execution packet
        working-directory: dex
        run: node scripts/generate-master6-live-execution-packet.mjs
