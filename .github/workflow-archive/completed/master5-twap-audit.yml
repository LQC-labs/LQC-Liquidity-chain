name: Master 5 TWAP Audit
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  twap-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node test/master5-twap-audit.test.js
      - run: node test/master5-reference-feed.test.js
