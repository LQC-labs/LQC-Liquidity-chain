name: Master 4 Vault Read Interface
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  read-interface:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node test/master4-vault-read-interface.test.js
