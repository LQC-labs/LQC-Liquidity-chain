name: Master 7 4 Perp Accounting Gap Review

on:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  gap-review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: dex/package-lock.json
      - name: Install locked DEX dependencies
        working-directory: dex
        run: npm ci --ignore-scripts
      - name: Compile current protocol sources
        working-directory: dex
        run: npm run compile
      - name: Verify current on-chain vs app-layer gap classification
        run: node --test test/master7-4-perp-gap-review.test.js
      - name: Re-run Futures funding fee position insurance and ADL specs
        working-directory: dex
        run: >
          npx mocha --timeout 30000
          test/futures-funding-engine.test.mjs
          test/futures-fee-engine.test.mjs
          test/futures-liquidation-engine.test.mjs
          test/futures-insurance-engine.test.mjs
          test/futures-adl-engine.test.mjs
      - name: Re-run integrated controller/accounting regressions
        working-directory: dex
        run: >
          node --test
          test/futures-funding-controller.test.mjs
          test/futures-fee-controller.test.mjs
          test/futures-position-engine.test.mjs
          test/futures-shared-insurance-flow.test.mjs
