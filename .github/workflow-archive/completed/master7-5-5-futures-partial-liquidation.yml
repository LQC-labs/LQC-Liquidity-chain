name: Master 7 5 5 Futures Partial Liquidation

on:
  pull_request:
    paths:
      - 'dex/contracts/futures/LQCPerpEngine.sol'
      - 'dex/contracts/futures/LQCFuturesVault.sol'
      - 'dex/test/futures-partial-liquidation-onchain.test.mjs'
      - 'dex/test/futures-funding-accounting.test.mjs'
      - 'dex/test/futures-insurance-bad-debt.test.mjs'
      - 'docs/master7/7-5-5-futures-partial-liquidation.md'
      - '.github/workflows/master7-5-5-futures-partial-liquidation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  partial-liquidation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: dex/package-lock.json
      - name: Install locked DEX dependencies
        working-directory: dex
        run: npm ci --ignore-scripts
      - name: Compile changed Futures contracts
        working-directory: dex
        run: npm run compile
      - name: Run focused partial-liquidation regression
        working-directory: dex
        run: >
          npx mocha --timeout 30000
          test/futures-partial-liquidation-onchain.test.mjs
          test/futures-funding-accounting.test.mjs
          test/futures-insurance-bad-debt.test.mjs
