name: Master 3 Best Execution Proof Consumption
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  proof-consumption:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node test/master3-best-execution-proof-consumption.test.js
