name: Master 5 Oracle Freshness
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node test/master5-freshness.test.js
      - run: node test/master5-reference-feed.test.js
      - run: node test/master5-primary-feed.test.js
