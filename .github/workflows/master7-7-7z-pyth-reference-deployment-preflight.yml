name: Master 7/7-7Z Pyth Reference Deployment Preflight
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "dex/scripts/preflight-master7-7-7z-pyth-reference-deployment.mjs"
      - "dex/test/master7-7-7z-pyth-reference-deployment-preflight.test.mjs"
      - ".github/workflows/master7-7-7z-pyth-reference-deployment-preflight.yml"
      - "dex/contracts/futures/LQCPythReferenceAdapter.sol"
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: dex}}
    env:
      BSC_TESTNET_RPC_URL: "https://data-seed-prebsc-1-s1.bnbchain.org:8545"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - run: npm ci --ignore-scripts
      - run: npm run compile
      - run: npx mocha "test/master7-7-7z-pyth-reference-deployment-preflight.test.mjs"
      - run: node scripts/preflight-master7-7-7z-pyth-reference-deployment.mjs
