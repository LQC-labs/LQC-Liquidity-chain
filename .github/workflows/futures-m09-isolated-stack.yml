name: Futures M09 isolated parallel stack verification
on:
  push:
    branches: [research/futures-m02-m03-isolated]
    paths:
      - "test/LQCFuturesMigrationM09IsolatedStack.t.sol"
      - ".github/workflows/futures-m09-isolated-stack.yml"
permissions:
  contents: read
concurrency:
  group: futures-m09-isolated-stack
  cancel-in-progress: true
jobs:
  m09-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          cache: false
      - name: Run only M09 isolation and historic-rights tests
        run: |
          forge test --root . --contracts dex/contracts \
            --use 0.8.30 --optimize --optimizer-runs 200 --via-ir \
            --evm-version shanghai \
            --match-path test/LQCFuturesMigrationM09IsolatedStack.t.sol -vv
