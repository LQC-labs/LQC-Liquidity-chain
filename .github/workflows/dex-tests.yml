name: DEX tests

on:
  pull_request:
    paths:
      - "dex/**"
      - "scripts/master3-router-interface-isolation-audit.js"
      - "scripts/master3-adapter-registry-boundary-audit.js"
      - "test/master3-adapter-registry-boundary-audit.test.js"
      - "docs/master3/3-5-adapter-registry-boundary.md"
      - "test/master3-router-interface-isolation-audit.test.js"
      - "docs/master3/3-4-router-interface-isolation.md"
      - ".github/workflows/dex-tests.yml"
  push:
    branches:
      - main
    paths:
      - "dex/**"
      - ".github/workflows/dex-tests.yml"

permissions:
  contents: read

concurrency:
  group: dex-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Compile, test, and audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: dex

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dex/package-lock.json

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Verify Master 3/4 isolation audit structure
        working-directory: .
        run: node test/master3-router-interface-isolation-audit.test.js

      - name: Audit Router Core module-state isolation
        working-directory: .
        run: node scripts/master3-router-interface-isolation-audit.js

      - name: Verify Master 3/5 adapter registry audit structure
        working-directory: .
        run: node test/master3-adapter-registry-boundary-audit.test.js

      - name: Audit Router Adapter / Registry boundary
        working-directory: .
        run: node scripts/master3-adapter-registry-boundary-audit.js

      - name: Compile contracts
        run: npm run compile

      - name: Report Router 2.0 release readiness
        run: node scripts/report-router2-release-readiness.mjs

      - name: Compile and run tests
        run: npm test

      - name: Reject production dependency vulnerabilities
        run: npm audit --omit=dev --audit-level=low

      - name: Classify development-tool advisories
        run: |
          npm audit --json > npm-audit.json || true
          node -e 'const a=require("./npm-audit.json"); const rows=Object.entries(a.vulnerabilities||{}).map(([name,v])=>({name,severity:v.severity,direct:v.isDirect,via:(v.via||[]).map(x=>typeof x==="string"?x:x.name).join(","),fix:JSON.stringify(v.fixAvailable)})); console.log(JSON.stringify({metadata:a.metadata,packages:rows},null,2))'
