name: Master 6 Governance Execution Approval Boundary
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  approval-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: dex/package-lock.json
      - name: Install locked DEX dependencies
        working-directory: dex
        run: npm ci
      - name: Run Governance execution approval boundary regressions
        run: node --test test/master6-governance-execution-approval-boundary.test.js
