name: Master 5 Feed Registry Audit
on:
  pull_request:
    paths:
      - 'dex/contracts/lending/LQCOracleManager.sol'
      - 'dex/contracts/router-v2/interfaces/ILQCPriceFeed.sol'
      - 'docs/ORACLE_INTERFACE_BOUNDARY.md'
      - 'docs/master5/5-1-feed-registry-audit.md'
      - 'test/master5-feed-registry-audit.test.js'
      - '.github/workflows/master5-feed-registry-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  feed-registry-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node test/master5-feed-registry-audit.test.js
