name: Master 7 1 Futures Reuse Regression

on:
  pull_request:
    paths:
      - 'dex/contracts/futures/**'
      - 'dex/app/futures/**'
      - 'dex/test/futures*.test.mjs'
      - 'dex/test/lqc-flow-futures.test.mjs'
      - 'dex/deployments/bsc-testnet/futures-2026-09-19.md'
      - 'docs/futures/BSC_TESTNET_TX_EVIDENCE.md'
      - 'test/master7-futures-reuse-regression.test.js'
      - 'docs/master7/7-1-futures-reuse-regression.md'
      - '.github/workflows/master7-1-futures-reuse-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  futures-reuse:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: dex/package-lock.json
      - name: Install locked DEX dependencies
        working-directory: dex
        run: npm ci --ignore-scripts
      - name: Compile current protocol sources
        working-directory: dex
        run: npm run compile
      - name: Verify Master 7 reuse and evidence boundaries
        run: node --test test/master7-futures-reuse-regression.test.js
      - name: Run current Futures contract and integration regressions
        working-directory: dex
        run: >
          npx mocha --timeout 30000
          test/futures.test.mjs
          test/lqc-flow-futures.test.mjs
          test/futures-oracle-adapter.test.mjs
          test/futures-testnet-e2e.test.mjs
          test/futures-security-gate.test.mjs
          test/futures-production-oracle-gate.test.mjs
          test/futures-funding-engine.test.mjs
      - name: Run Insurance and ADL regression
        working-directory: dex
        run: node --test test/futures-shared-insurance-flow.test.mjs
