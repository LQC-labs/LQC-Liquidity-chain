name: Master 6 Live Wallet Handoff
on:
  pull_request:
    paths:
      - 'dex/contracts/lending/**'
      - 'dex/scripts/generate-master6-live-execution-packet.mjs'
      - 'dex/deployments/master6-live-execution-packet-bsc-testnet-97.json'
      - 'test/master6-live-wallet-handoff-record.test.js'
      - '.github/workflows/master6-live-wallet-handoff.yml'
permissions:
  contents: read
jobs:
  validate-record:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: dex/package-lock.json
      - name: Install DEX dependencies
        working-directory: dex
        run: npm ci
      - name: Compile current Lending sources
        working-directory: dex
        run: npm run compile
      - name: Verify recorded live wallet handoff packet
        run: node --test test/master6-live-wallet-handoff-record.test.js
