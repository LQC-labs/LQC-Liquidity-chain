name: Master 7/7-7D TWAP Deployment Recovery
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "dex/scripts/verify-master7-7-7d-twap-deployment-recovery.mjs"
      - "dex/test/master7-7-7d-twap-deployment-recovery.test.mjs"
      - ".github/workflows/master7-7-7d-twap-deployment-recovery.yml"
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: dex
    env:
      BSC_TESTNET_RPC_URL: https://data-seed-prebsc-1-s1.bnbchain.org:8545
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dex/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npx mocha --timeout 30000 "test/master7-7-7d-twap-deployment-recovery.test.mjs"
      - name: Verify recovered TWAP deployment on BSC Testnet
        run: node scripts/verify-master7-7-7d-twap-deployment-recovery.mjs
