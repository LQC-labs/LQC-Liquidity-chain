name: Master 7/7-7N Governance Post-state Recovery
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "dex/app/futures/governance-oracle-config-page.js"
      - "dex/test/master7-7-7m-governance-oracle-config-page.test.mjs"
      - "dex/scripts/check-master7-7-7n-live-governance-state.mjs"
      - ".github/workflows/master7-7-7n-governance-poststate-recovery.yml"
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: dex}}
    env: {BSC_TESTNET_RPC_URL: "https://data-seed-prebsc-1-s1.bnbchain.org:8545"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - run: npm ci --ignore-scripts
      - run: npx mocha "test/master7-7-7m-governance-oracle-config-page.test.mjs"
      - run: node scripts/check-master7-7-7n-live-governance-state.mjs
