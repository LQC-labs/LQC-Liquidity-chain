name: Master 6 Clean Lending Mobile Deploy
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mobile-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify guarded mobile deployment page
        run: node --test test/master6-clean-lending-mobile-deploy.test.js
