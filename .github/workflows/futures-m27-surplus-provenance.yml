name: Futures M27 source-of-funds provenance review (isolated)
on:
  push:
    branches: [research/futures-m02-m03-isolated]
    paths:
      - "dex/contracts/futures/LQCFuturesM27SurplusProvenanceReview.sol"
      - "test/LQCFuturesMigrationM27SurplusProvenance.t.sol"
      - ".github/workflows/futures-m27-surplus-provenance.yml"
permissions:
  contents: read
concurrency:
  group: futures-m27-provenance
  cancel-in-progress: true
jobs:
  m27-provenance:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          cache: false
      - name: Focused M27 provenance and quote reservations
        run: |
          forge test --root . --contracts dex/contracts \
            --use 0.8.30 --optimize --optimizer-runs 200 --via-ir \
            --evm-version shanghai \
            --match-path test/LQCFuturesMigrationM27SurplusProvenance.t.sol -vv
