name: Master 6 Repay Safety
on:
  push:
    paths:
      - 'dex/contracts/lending/LQCLendingMarketRegistry.sol'
      - 'dex/contracts/lending/LQCLendingCore.sol'
      - 'dex/test/lending-repay-gate.test.mjs'
      - 'dex/test/lending-repay-boundaries.test.mjs'
      - 'dex/test/lending-core.test.mjs'
      - 'docs/master6/6-8-repay-safety.md'
      - 'test/master6-repay-safety.test.js'
      - '.github/workflows/master6-repay-safety.yml'
  pull_request:
    paths:
      - 'dex/contracts/lending/LQCLendingMarketRegistry.sol'
      - 'dex/contracts/lending/LQCLendingCore.sol'
      - 'dex/test/lending-repay-gate.test.mjs'
      - 'dex/test/lending-repay-boundaries.test.mjs'
      - 'dex/test/lending-core.test.mjs'
      - 'docs/master6/6-8-repay-safety.md'
      - 'test/master6-repay-safety.test.js'
      - '.github/workflows/master6-repay-safety.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  repay-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: dex/package-lock.json
      - name: Master 6/8 static gate
        run: node test/master6-repay-safety.test.js
      - name: Install locked DEX dependencies
        working-directory: dex
        run: npm ci
      - name: Compile and run complete DEX test suite
        working-directory: dex
        run: npm test
