name: Master 6 Live Execution Packet
on:
  pull_request:
    paths:
      - 'dex/contracts/lending/**'
      - 'dex/scripts/generate-master6-live-execution-packet.mjs'
      - 'dex/scripts/prepare-master6-clean-lending-deployment.mjs'
      - 'dex/scripts/preflight-master6-clean-lending.mjs'
      - '.github/workflows/master6-live-execution-packet.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-packet:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: dex/package-lock.json
      - name: Install DEX dependencies
        working-directory: dex
        run: npm ci
      - name: Compile current Lending sources
        working-directory: dex
        run: npm run compile
      - name: Generate live approved execution packet
        working-directory: dex
        run: node scripts/generate-master6-live-execution-packet.mjs
