name: Add LQC personal profile links
on:
  push:
    paths:
      - '.github/workflows/add-profile-links.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add profile buttons to homepage
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          marker='  <div class="entity-note"><strong>Legal entity:</strong> MMXlabs&amp;LQC LLC · Wyoming limited liability company · Filed April 30, 2026.<br><strong>Principal office and mailing address:</strong> 1603 Capitol Ave., Suite 310 - #WY144, Cheyenne, WY 82001, United States.</div>'
          block='''\n  <div class="team-profile-links" style="margin-top:22px;display:flex;gap:12px;flex-wrap:wrap">\n    <a class="btn" href="team/ali-isik.html" aria-label="Open ALI ISIK personal profile">ALI ISIK · Personal Profile →</a>\n    <a class="btn" href="team/jeong-jae-won.html" aria-label="Open JEONG JAE-WON personal profile">JEONG JAE-WON · Personal Profile →</a>\n  </div>'''
          if 'team-profile-links' not in s:
              if marker not in s:
                  raise SystemExit('legal entity marker not found')
              s=s.replace(marker, marker+block, 1)
              p.write_text(s)
          PY
      - name: Commit homepage links and remove helper
        run: |
          rm .github/workflows/add-profile-links.yml
          git config user.name "LQC-labs"
          git config user.email "mahogani2018@gmail.com"
          git add -A
          git commit -m "Add Ali Isik and Jeong Jae-won personal profile links"
          git push
