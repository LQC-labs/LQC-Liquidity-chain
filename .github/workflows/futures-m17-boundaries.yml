name: Futures M17 partial-liquidation and rounding boundaries
on:
  push:
    branches: [research/futures-m02-m03-isolated]
    paths:
      - "test/LQCFuturesMigrationM17Boundary.t.sol"
      - ".github/workflows/futures-m17-boundaries.yml"
permissions:
  contents: read
concurrency:
  group: futures-m17-boundaries
  cancel-in-progress: true
jobs:
  m17-boundaries:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          cache: false
      - name: Focused M17 boundary and economic risk tests
        run: |
          forge test --root . --contracts dex/contracts \
            --use 0.8.30 --optimize --optimizer-runs 200 --via-ir \
            --evm-version shanghai \
            --match-path test/LQCFuturesMigrationM17Boundary.t.sol -vv
