name: Master 6 Supply Withdraw
on:
  push:
    paths:
      - 'dex/**'
      - 'docs/master6/6-5-collateral-audit.md'
      - 'test/master6-collateral-audit.test.js'
      - 'docs/master6/6-6-supply-withdraw.md'
      - 'test/master6-supply-withdraw.test.js'
      - '.github/workflows/master6-supply-withdraw.yml'
  pull_request:
    paths:
      - 'dex/**'
      - 'docs/master6/6-5-collateral-audit.md'
      - 'test/master6-collateral-audit.test.js'
      - 'docs/master6/6-6-supply-withdraw.md'
      - 'test/master6-supply-withdraw.test.js'
      - '.github/workflows/master6-supply-withdraw.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  supply-withdraw:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: dex/package-lock.json
      - name: Master 6/6 static gate
        run: node test/master6-supply-withdraw.test.js
      - name: Install locked DEX dependencies
        working-directory: dex
        run: npm ci
      - name: Compile and run complete DEX test suite
        working-directory: dex
        run: npm test
