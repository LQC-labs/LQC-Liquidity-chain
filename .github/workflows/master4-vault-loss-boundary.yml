name: Master 4 Vault Strategy Loss Boundary
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  loss-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node test/master4-vault-loss-boundary.test.js
      - run: node test/master4-vault-accounting-invariant.test.js
      - run: node test/master4-router-vault-read-boundary.test.js
