name: Master 5 Oracle Circuit Breaker
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  circuit-breaker:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node test/master5-circuit-breaker.test.js
      - run: node test/master5-deviation.test.js
      - run: node test/master5-freshness.test.js
