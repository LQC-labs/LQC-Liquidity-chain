name: Futures M08 historical position snapshot (bounded read-only)

on:
  push:
    branches: [research/futures-m02-m03-isolated]
    paths:
      - "dex/scripts/observe-futures-m08-historical-positions.mjs"
      - ".github/workflows/futures-m08-historical-positions.yml"

permissions:
  contents: read

concurrency:
  group: futures-m08-historical-positions
  cancel-in-progress: true

jobs:
  historical-positions:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: dex
    steps:
      - name: Checkout research branch without credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dex/package-lock.json
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Validate observer syntax
        run: node --check scripts/observe-futures-m08-historical-positions.mjs
      - name: Bounded historical event and current account reads
        env:
          BSC_TESTNET_READONLY_RPC: https://bsc-testnet-rpc.publicnode.com
        run: node scripts/observe-futures-m08-historical-positions.mjs
      - name: Preserve read-only report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: futures-m08-historical-positions-readonly
          path: dex/futures-m08-historical-positions.json
          if-no-files-found: warn
          retention-days: 14
