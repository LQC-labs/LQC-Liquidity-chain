name: Futures M19 decimals and fee-policy boundaries
on:
  push:
    branches: [research/futures-m02-m03-isolated]
    paths:
      - "test/LQCFuturesMigrationM19DecimalsRateTransitions.t.sol"
      - ".github/workflows/futures-m19-decimals-rate.yml"
permissions:
  contents: read
concurrency:
  group: futures-m19-decimals-rate
  cancel-in-progress: true
jobs:
  m19-precision:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          cache: false
      - name: Focused M19 precision and governance transition cases
        run: |
          forge test --root . --contracts dex/contracts \
            --use 0.8.30 --optimize --optimizer-runs 200 --via-ir \
            --evm-version shanghai \
            --match-path test/LQCFuturesMigrationM19DecimalsRateTransitions.t.sol -vv
