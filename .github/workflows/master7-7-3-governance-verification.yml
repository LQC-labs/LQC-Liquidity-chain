name: Master 7/7-3 Governance Configuration Verification

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "dex/scripts/verify-master7-7-3-governance.mjs"
      - ".github/workflows/master7-7-3-governance-verification.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: master7-7-3-governance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-governance-configuration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: dex
    env:
      BSC_TESTNET_RPC_URL: https://data-seed-prebsc-1-s1.bnbchain.org:8545
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dex/package-lock.json
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Verify 7/7-3 Governance Configuration on BSC Testnet
        run: node scripts/verify-master7-7-3-governance.mjs
