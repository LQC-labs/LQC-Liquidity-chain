name: Futures M18 fee remainder candidate isolation
on:
  push:
    branches: [research/futures-m02-m03-isolated]
    paths:
      - "dex/contracts/futures/LQCPerpEngineM18FeeRemainderCandidate.sol"
      - "test/LQCFuturesMigrationM18FeeRemainder.t.sol"
      - ".github/workflows/futures-m18-fee-remainder.yml"
permissions:
  contents: read
concurrency:
  group: futures-m18-fee-remainder
  cancel-in-progress: true
jobs:
  m18-fee:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          cache: false
      - name: Focused M18 split/single and remainder integration
        run: |
          forge test --root . --contracts dex/contracts \
            --use 0.8.30 --optimize --optimizer-runs 200 --via-ir \
            --evm-version shanghai \
            --match-path test/LQCFuturesMigrationM18FeeRemainder.t.sol -vv
