name: Master 4 Vault Gap Classification
on:
  pull_request:
    paths:
      - 'docs/master4/4-2-vault-gap-*'
      - 'test/master4-vault-gap-classification.test.js'
      - '.github/workflows/master4-vault-gap-classification.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gap-classification:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node test/master4-vault-gap-classification.test.js
