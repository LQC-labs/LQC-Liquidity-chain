name: Futures M08 independent historical receipt crosscheck
on:
  push:
    branches: [research/futures-m02-m03-isolated]
    paths:
      - "dex/scripts/verify-futures-m08-receipts.mjs"
      - ".github/workflows/futures-m08-receipt-crosscheck.yml"
permissions:
  contents: read
concurrency:
  group: futures-m08-receipt-crosscheck
  cancel-in-progress: true
jobs:
  receipts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: dex
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dex/package-lock.json
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Syntax-check crosscheck
        run: node --check scripts/verify-futures-m08-receipts.mjs
      - name: Read and compare five receipts plus pinned balances
        env:
          BSC_TESTNET_READONLY_RPC: https://bsc-testnet-rpc.publicnode.com
        run: node scripts/verify-futures-m08-receipts.mjs
      - name: Preserve read-only evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: futures-m08-receipts-readonly
          path: dex/futures-m08-receipt-crosscheck.json
          if-no-files-found: warn
          retention-days: 14
