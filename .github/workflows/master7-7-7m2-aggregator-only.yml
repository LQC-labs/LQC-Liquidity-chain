name: Master 7/7-7M-2 Aggregator-only Gate
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "dex/scripts/prepare-master7-7-7m2-aggregator-only.mjs"
      - "dex/test/master7-7-7m2-aggregator-only.test.mjs"
      - ".github/workflows/master7-7-7m2-aggregator-only.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: dex
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dex/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run compile
      - run: npx mocha "test/master7-7-7m2-aggregator-only.test.mjs"
