name: Futures M21 USD18 six-and-eighteen-decimal cash integration
on:
  push:
    branches: [research/futures-m02-m03-isolated]
    paths:
      - "dex/contracts/futures/LQCPerpEngineM21Usd18Candidate.sol"
      - "test/LQCFuturesMigrationM21Usd18SixDecimal.t.sol"
      - "test/LQCFuturesMigrationM21Usd18Regression.t.sol"
      - ".github/workflows/futures-m21-usd18-precision.yml"
permissions:
  contents: read
concurrency:
  group: futures-m21-usd18-precision
  cancel-in-progress: true
jobs:
  m21-precision:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          cache: false
      - name: Focused M21 USD18 precision and 18-decimal regression
        run: |
          forge test --root . --contracts dex/contracts \
            --use 0.8.30 --optimize --optimizer-runs 200 --via-ir \
            --evm-version shanghai \
            --match-path 'test/LQCFuturesMigrationM21*.t.sol' -vv
