name: Master 7/7-8C Pyth Mobile Deployment Packet
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "dex/app/futures-pyth-testnet-deploy.html"
      - "dex/app/futures/futures-pyth-testnet-deploy.js"
      - "dex/scripts/build-master7-7-8c-pyth-runtime-artifacts.mjs"
      - "dex/test/master7-7-8c-pyth-mobile-deployment.test.mjs"
      - ".github/workflows/master7-7-8c-pyth-mobile-deployment.yml"
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: dex}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - run: npm ci --ignore-scripts
      - run: npm run compile
      - run: node scripts/build-master7-7-8c-pyth-runtime-artifacts.mjs
      - run: npx mocha "test/master7-7-8c-pyth-mobile-deployment.test.mjs"
