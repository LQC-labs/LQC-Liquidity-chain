name: Fix JEONG JAE-WON homepage link
on:
  push:
    paths:
      - '.github/workflows/fix-jeong-jae-won-link.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Replace advisor name and link only
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='<a class="btn" href="team/jeong-jae-yoon.html" aria-label="View JEONG JAE-YOON Advisor profile">Meet JEONG JAE-YOON · Advisor →</a>'
          new='<a class="btn" href="team/jeong-jae-won.html" aria-label="View JEONG JAE-WON Advisor profile">Meet JEONG JAE-WON · Advisor →</a>'
          if old not in s:
              raise SystemExit('Target link not found; refusing broad edit')
          s2=s.replace(old,new,1)
          if s2.count('JEONG JAE-YOON') != s.count('JEONG JAE-YOON')-2:
              raise SystemExit('Unexpected replacement scope')
          p.write_text(s2)
          PY
      - name: Commit homepage-only change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Replace JEONG JAE-YOON with JEONG JAE-WON on homepage'
          git push origin main
