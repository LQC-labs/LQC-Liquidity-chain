name: Master 4 Vault Accounting Invariants
on:
  pull_request:
    paths:
      - 'dex/contracts/vault/**'
      - 'scripts/master4-vault-accounting-invariant.js'
      - 'test/master4-vault-accounting-invariant.test.js'
      - 'docs/master4/4-5-vault-accounting-invariants.md'
      - '.github/workflows/master4-vault-accounting-invariants.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  invariants:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node test/master4-vault-accounting-invariant.test.js
      - run: node test/master4-vault-reuse-audit.test.js
      - run: node test/master4-vault-read-interface.test.js
      - run: node test/master4-strategy-adapter-metadata.test.js
