name: Futures M23 collateral depeg guard isolation
on:
  push:
    branches: [research/futures-m02-m03-isolated]
    paths:
      - "dex/contracts/futures/LQCFuturesM23CollateralDepegGuard.sol"
      - "test/LQCFuturesMigrationM23CollateralDepegGuard.t.sol"
      - ".github/workflows/futures-m23-depeg-guard.yml"
permissions:
  contents: read
concurrency:
  group: futures-m23-depeg-guard
  cancel-in-progress: true
jobs:
  m23-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          cache: false
      - name: Focused dual-feed depeg, freshness and Guardian tests
        run: |
          forge test --root . --contracts dex/contracts \
            --use 0.8.30 --optimize --optimizer-runs 200 --via-ir \
            --evm-version shanghai \
            --match-path test/LQCFuturesMigrationM23CollateralDepegGuard.t.sol -vv
