name: Futures offline evaluation
on:
  pull_request:
    paths:
      - "dex/research/futures-evaluation/**"
      - ".github/workflows/futures-offline-evaluation.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: futures-offline-evaluation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  offline-evaluation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: dex
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dex/package-lock.json
      - name: Install existing locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify recorded inputs and diagnostics without a chain
        run: node research/futures-evaluation/run-tests.cjs
      - name: Verify settlement link diagnosis and fixed test runner without a chain
        run: node research/futures-evaluation/run-settlement-link-tests.cjs research/futures-evaluation/.results/settlement-link-ci new
      - name: Verify shared obligation reconciliation and identity guards without a chain
        run: node research/futures-evaluation/run-shared-reconciliation-tests.cjs research/futures-evaluation/.results/shared-reconciliation-ci new
      - name: Verify fixed synthetic references and submitted event links without a chain
        run: node research/futures-evaluation/run-fixed-independent-tests.cjs research/futures-evaluation/.results/fixed-independent-ci

  stored-exit-history-research:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: dex/research/futures-evaluation/stored-exit-history
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
          cache: npm
          cache-dependency-path: dex/research/futures-evaluation/stored-exit-history/package-lock.json
      - name: Install isolated research dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify Anvil lifecycle with mocked processes and RPC only
        run: node run-anvil-lifecycle-tests.cjs
      - name: Compile pinned research fixtures
        run: node compile.cjs
      - name: Check fail-closed build preflight
        run: node preflight-selfchecks.cjs
      - name: Verify stored exit history on local Anvil only
        run: node run-tests.cjs
      - name: Compare fixed-Q stored history with existing JS diagnostics on local Anvil only
        run: node run-fixed-q-tests.cjs
      - name: Preserve stored-history research results on success or failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stored-exit-history-research-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dex/research/futures-evaluation/stored-exit-history/results/
            !dex/research/futures-evaluation/stored-exit-history/results/**/node_modules
            !dex/research/futures-evaluation/stored-exit-history/results/**/node_modules/**
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 14

  collection-consumption-research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        working-directory: dex/research/futures-evaluation/collection-consumption-fixture
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
          cache: npm
          cache-dependency-path: dex/research/futures-evaluation/collection-consumption-fixture/package-lock.json
      - name: Install locked fixture dependencies once without lifecycle scripts
        timeout-minutes: 3
        shell: bash
        run: |
          mkdir -p results/linux-install
          set +e
          npm ci --ignore-scripts --no-audit --no-fund >results/linux-install/stdout.log 2>results/linux-install/stderr.log
          status=$?
          printf '{"exitCode":%s,"automaticRetry":false}\n' "$status" >results/linux-install/exit-code.json
          exit "$status"
      - name: Reproduce reviewed build and validate isolated mocks then 17 Anvil tests once
        timeout-minutes: 24
        run: node run-linux-once.cjs run
      - name: Stage only explicitly approved evidence even after failure
        if: always()
        timeout-minutes: 2
        run: node run-linux-once.cjs collect
      - name: Preserve collection consumption evidence separately
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collection-consumption-research-${{ github.run_id }}-${{ github.run_attempt }}
          path: dex/research/futures-evaluation/collection-consumption-fixture/results/linux-artifact/
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 14
