name: Master 2 LQC Flow Runtime Reconciliation
on:
  workflow_dispatch:
jobs:
  reconcile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dex
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: dex/package-lock.json
      - run: npm ci
      - run: npm run compile
      - name: Read-only BSC Testnet runtime reconciliation
        run: node scripts/reconcile-lqc-flow-runtime-testnet.mjs
