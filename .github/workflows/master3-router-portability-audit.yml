name: Master 3 Router Portability Audit
on:
  pull_request:
    paths:
      - 'dex/contracts/router-v2/**'
      - 'scripts/master3-router-portability-audit.js'
      - 'docs/master3/3-2-router-portability-boundary.md'
      - '.github/workflows/master3-router-portability-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portability:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Audit Router Core for chain-specific assumptions
        run: node scripts/master3-router-portability-audit.js
      - name: Preserve activation boundary
        run: grep -Fq '`activationAuthorized: false`' docs/master3/3-2-router-portability-boundary.md
