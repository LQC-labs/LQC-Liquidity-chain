name: Master 7/7-8B Pyth Update Helper Deployment Packet
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "dex/scripts/build-master7-7-8b-pyth-update-helper-deployment-packet.mjs"
      - "dex/scripts/preflight-master7-7-8b-pyth-update-helper-deployment.mjs"
      - "dex/test/master7-7-8b-pyth-update-helper-deployment.test.mjs"
      - ".github/workflows/master7-7-8b-pyth-update-helper-deployment.yml"
      - "dex/contracts/futures/LQCPythUpdateHelper.sol"
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: dex}}
    env:
      BSC_TESTNET_RPC_URL: "https://data-seed-prebsc-1-s1.bnbchain.org:8545"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - run: npm ci --ignore-scripts
      - run: npm run compile
      - run: node scripts/build-master7-7-8b-pyth-update-helper-deployment-packet.mjs
      - run: npx mocha "test/master7-7-8b-pyth-update-helper-deployment.test.mjs"
      - run: node scripts/preflight-master7-7-8b-pyth-update-helper-deployment.mjs
