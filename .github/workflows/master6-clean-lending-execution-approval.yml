name: Master 6 Clean Lending Execution Approval Boundary
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  approval-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: dex/package-lock.json
      - name: Install DEX dependencies
        working-directory: dex
        run: npm ci
      - name: Verify execution approval boundary
        run: node --test test/master6-clean-lending-execution-approval.test.js
