name: Master 6 Lending Interest Index Audit
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  interest-index-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node test/master6-interest-index-audit.test.js
