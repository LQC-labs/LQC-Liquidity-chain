name: Master 3 Router Proof Revalidation

on:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  proof-revalidation:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run fail-closed proof revalidation tests
        run: node test/master3-router-proof-revalidation.test.js
      - name: Run portability audit structure tests
        run: node test/master3-router-portability-audit.test.js
      - name: Audit Router Core portability
        run: node scripts/master3-router-portability-audit.js
      - name: Audit proof deployment-domain separation
        run: node test/master3-router-domain-separation-audit.test.js
      - name: Run interface-isolation audit structure tests
        run: node test/master3-router-interface-isolation-audit.test.js
      - name: Audit Router Core module-state isolation
        run: node scripts/master3-router-interface-isolation-audit.js
      - name: Install DEX dependencies
        working-directory: dex
        run: npm ci
      - name: Compile Router contracts
        working-directory: dex
        run: npm run compile
      - name: Run Best Execution proof EVM regression
        working-directory: dex
        run: npx mocha test/router2-best-execution-proof-boundaries.test.mjs
      - name: Enforce no activation authorization
        run: grep -R -Fq 'activationAuthorized: false' docs/master3
