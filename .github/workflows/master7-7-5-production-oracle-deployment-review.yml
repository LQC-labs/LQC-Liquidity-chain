name: Master 7/7-5 Production Oracle Deployment Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "dex/scripts/build-master7-7-5-production-oracle-deployment-review.mjs"
      - "dex/test/master7-7-5-production-oracle-deployment-review.test.mjs"
      - ".github/workflows/master7-7-5-production-oracle-deployment-review.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: master7-7-5-production-oracle-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deployment-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: dex
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dex/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run compile
      - name: Focused 7/7-5 deployment review tests
        run: npx mocha --timeout 30000 "test/master7-7-5-production-oracle-deployment-review.test.mjs"
