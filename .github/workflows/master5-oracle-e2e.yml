name: Master 5 Oracle E2E Completion
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  oracle-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node test/master5-oracle-e2e.test.js
      - run: node test/master5-feed-registry-audit.test.js
      - run: node test/master5-primary-feed.test.js
      - run: node test/master5-reference-feed.test.js
      - run: node test/master5-twap-audit.test.js
      - run: node test/master5-freshness.test.js
      - run: node test/master5-deviation.test.js
      - run: node test/master5-circuit-breaker.test.js
      - name: Install DEX dependencies
        working-directory: dex
        run: npm ci
      - name: Compile contracts
        working-directory: dex
        run: npm run compile
      - name: Run Oracle runtime regression
        working-directory: dex
        run: npx mocha --timeout 30000 test/lending-oracle-manager.test.mjs test/futures-oracle-adapter.test.mjs test/futures-twap-reference-qualification.test.mjs test/futures-twap-price-conversion.test.mjs test/futures-oracle-guard.test.mjs
