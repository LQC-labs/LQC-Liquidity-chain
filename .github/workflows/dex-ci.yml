name: LQC DEX Final Regression

on:
  push:
    branches: [main]
    paths:
      - "dex/**"
      - ".github/workflows/dex-ci.yml"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "dex/**"
      - ".github/workflows/dex-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lqc-dex-final-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: dex
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dex/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Full post-merge regression
        run: npm test
