name: Master 6 Governance Configuration Proposal
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  proposal:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: dex/package-lock.json
      - name: Install DEX dependencies
        working-directory: dex
        run: npm ci
      - name: Compile current Lending sources
        working-directory: dex
        run: npm run compile
      - name: Run proposal safety regressions
        run: node --test test/master6-governance-configuration-proposal.test.js
      - name: Prepare live read-only Governance Safe proposal packet
        working-directory: dex
        run: node scripts/prepare-master6-governance-configuration.mjs
