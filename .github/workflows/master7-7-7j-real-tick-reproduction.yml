name: Master 7/7-7J Real Tick Reproduction

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "dex/test/futures-twap-runtime-reference.test.mjs"
      - ".github/workflows/master7-7-7j-real-tick-reproduction.yml"

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: dex
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dex/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run compile
      - run: npx mocha --timeout 30000 "test/futures-twap-runtime-reference.test.mjs" --grep "94548"
