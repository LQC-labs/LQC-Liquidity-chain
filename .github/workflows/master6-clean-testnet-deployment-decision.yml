name: Master 6 Clean Testnet Deployment Decision
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  clean-deployment-decision:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node test/master6-clean-testnet-deployment-decision.test.js
