name: Update JEONG JAE-WON portrait
on:
  push:
    branches: [main]
    paths: ['assets/jeong-jae-won-profile.jpg']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace profile image reference
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('team/jeong-jae-won.html')
          s=p.read_text()
          s=s.replace('assets/jeong-jae-yoon-lqc-profile.png','assets/jeong-jae-won-profile.jpg')
          s=s.replace('../assets/jeong-jae-yoon-lqc-profile.png','../assets/jeong-jae-won-profile.jpg')
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add team/jeong-jae-won.html
          git diff --cached --quiet && exit 0
          git commit -m "Use updated JEONG JAE-WON portrait"
          git push
