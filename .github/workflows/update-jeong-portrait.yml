name: Sync JEONG JAE-WON homepage card
on:
  push:
    branches: [main]
    paths: ['.github/workflows/update-jeong-portrait.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync homepage card to current JEONG profile image
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='assets/jeong-jae-won-profile.jpg'
          new='assets/jeong-jae-won-lqc-profile.jpg?v=card-20260905'
          if old not in s:
              raise SystemExit('Old JEONG homepage image reference not found')
          s=s.replace(old,new)
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Sync JEONG JAE-WON homepage card with current profile image"
          git push
