name: Futures M16 isolated accounting invariants
on:
  push:
    branches: [research/futures-m02-m03-isolated]
    paths:
      - "test/LQCFuturesMigrationM16AccountingInvariants.t.sol"
      - ".github/workflows/futures-m16-accounting-invariants.yml"
permissions:
  contents: read
concurrency:
  group: futures-m16-accounting
  cancel-in-progress: true
jobs:
  m16-accounting:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          cache: false
      - name: Focused M16 balance and debt invariants
        run: |
          forge test --root . --contracts dex/contracts \
            --use 0.8.30 --optimize --optimizer-runs 200 --via-ir \
            --evm-version shanghai \
            --match-path test/LQCFuturesMigrationM16AccountingInvariants.t.sol -vv
