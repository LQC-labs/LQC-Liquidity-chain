name: Master 5 Reference Feed
on:
  pull_request:
    paths:
      - 'dex/contracts/lending/LQCOracleManager.sol'
      - 'docs/ORACLE_INTERFACE_BOUNDARY.md'
      - 'docs/master5/5-3-reference-feed.md'
      - 'test/master5-reference-feed.test.js'
      - '.github/workflows/master5-reference-feed.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reference-feed:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node test/master5-reference-feed.test.js
      - run: node test/master5-primary-feed.test.js
      - run: node test/master5-feed-registry-audit.test.js
