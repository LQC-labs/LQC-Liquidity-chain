name: Master 3 Replay State Commitment
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  state-commitment:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node test/master3-replay-state-commitment.test.js
