name: Master 3 Best Execution Proof Binding
on:
  pull_request:
    paths:
      - 'scripts/master3-best-execution-proof-binding.js'
      - 'test/master3-best-execution-proof-binding.test.js'
      - 'docs/master3/3-8-best-execution-proof-binding.md'
      - '.github/workflows/master3-best-execution-proof-binding.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  proof-binding:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node test/master3-best-execution-proof-binding.test.js
