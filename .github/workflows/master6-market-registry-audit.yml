name: Master 6 Lending Market Registry Audit
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  market-registry-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node test/master6-market-registry-audit.test.js
