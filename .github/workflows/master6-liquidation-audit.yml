name: Master 6 Liquidation Audit
on:
  push:
    paths:
      - 'dex/contracts/lending/LQCLiquidationEngine.sol'
      - 'dex/contracts/lending/LQCLendingCore.sol'
      - 'dex/contracts/lending/LQCLendingMarketRegistry.sol'
      - 'dex/test/lending-liquidation-gate.test.mjs'
      - 'dex/test/lending-liquidation-boundaries.test.mjs'
      - 'dex/test/lending-health-factor-boundaries.test.mjs'
      - 'docs/master6/6-10-liquidation-audit.md'
      - 'test/master6-liquidation-audit.test.js'
      - '.github/workflows/master6-liquidation-audit.yml'
  pull_request:
    paths:
      - 'dex/contracts/lending/LQCLiquidationEngine.sol'
      - 'dex/contracts/lending/LQCLendingCore.sol'
      - 'dex/contracts/lending/LQCLendingMarketRegistry.sol'
      - 'dex/test/lending-liquidation-gate.test.mjs'
      - 'dex/test/lending-liquidation-boundaries.test.mjs'
      - 'dex/test/lending-health-factor-boundaries.test.mjs'
      - 'docs/master6/6-10-liquidation-audit.md'
      - 'test/master6-liquidation-audit.test.js'
      - '.github/workflows/master6-liquidation-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  liquidation-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: dex/package-lock.json
      - name: Master 6/10 static gate
        run: node test/master6-liquidation-audit.test.js
      - name: Install locked DEX dependencies
        working-directory: dex
        run: npm ci
      - name: Compile and run complete DEX test suite
        working-directory: dex
        run: npm test
