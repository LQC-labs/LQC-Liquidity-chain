name: TokenPocket Pyth UMD Loader
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "dex/app/futures-pyth-testnet-deploy.html"
      - "dex/app/futures/futures-pyth-testnet-deploy.js"
      - "dex/test/master7-7-8c-tokenpocket-umd-loader.test.mjs"
      - ".github/workflows/tokenpocket-pyth-umd-loader.yml"
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: dex}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - run: npm ci --ignore-scripts
      - run: npx mocha "test/master7-7-8c-tokenpocket-umd-loader.test.mjs"
      - run: node --check app/futures/futures-pyth-testnet-deploy.js
