name: Match JEONG profile image to ALI layout
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Match portrait proportions
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('team/jeong-jae-won.html')
          s = p.read_text()
          old = '.portrait img{display:block;width:100%;height:auto}'
          new = '.portrait img{display:block;width:100%;aspect-ratio:3/2;object-fit:cover;object-position:center 30%}'
          if old not in s:
              raise SystemExit('portrait rule not found')
          p.write_text(s.replace(old,new))
          PY
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add team/jeong-jae-won.html
          git diff --cached --quiet || git commit -m "Match JEONG JAE-WON portrait layout to ALI ISIK"
          git push
