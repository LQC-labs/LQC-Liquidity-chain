name: Master 4 Strategy Adapter Metadata
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node test/master4-strategy-adapter-metadata.test.js
