name: Patch team profile buttons

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-team-profile-buttons.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Update profile button color and placement
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = '''  <div style="margin-top:22px;display:flex;gap:12px;flex-wrap:wrap"><a class="btn primary" href="team/ali-isik.html" aria-label="View ALI ISIK Co-Founder profile">Meet ALI ISIK · Co-Founder →</a><a class="btn" href="team/jeong-jae-yoon.html" aria-label="View JEONG JAE-YOON Advisor profile">Meet JEONG JAE-YOON · Advisor →</a></div>\n  <div class="entity-note"><strong>Legal entity:</strong> MMXlabs&amp;LQC LLC · Wyoming limited liability company · Filed April 30, 2026.<br><strong>Principal office and mailing address:</strong> 1603 Capitol Ave., Suite 310 - #WY144, Cheyenne, WY 82001, United States.</div>'''
          new = '''  <div class="entity-note"><strong>Legal entity:</strong> MMXlabs&amp;LQC LLC · Wyoming limited liability company · Filed April 30, 2026.<br><strong>Principal office and mailing address:</strong> 1603 Capitol Ave., Suite 310 - #WY144, Cheyenne, WY 82001, United States.</div>\n  <div style="margin-top:22px;display:flex;gap:12px;flex-wrap:wrap"><a class="btn" href="team/ali-isik.html" aria-label="View ALI ISIK Co-Founder profile">Meet ALI ISIK · Co-Founder →</a><a class="btn" href="team/jeong-jae-yoon.html" aria-label="View JEONG JAE-YOON Advisor profile">Meet JEONG JAE-YOON · Advisor →</a></div>'''
          if old not in s:
              raise SystemExit('Target block not found; no changes made.')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Align team profile buttons and move below legal address"
          git push
